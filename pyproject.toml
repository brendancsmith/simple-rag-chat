[tool.isort]
profile = "black"
filter_files = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.poetry]
name = "simple-rag-chat"
version = "0.1.0"
description = ""
authors = ["Brendan Smith <mail@brendansmith.ai>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "~3.10"
openai = ">=1.3.5,<4.0.0"
langchain = ">=0.3,<1.4"
chainlit = ">=0.7.604,<2.12.0"
tiktoken = ">=0.5.1,<0.15.0"
pdfplumber = ">=0.10.3,<0.12.0"
chromadb = ">=0.4.17,<1.6.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.16"
isort = ">=5.12,<9.0"
pre-commit = ">=2.15,<5.0"

[tool.ruff]
target-version = "py310"
line-length = 80

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E", "W",  # see: https://pypi.org/project/pycodestyle
    "F",  # see: https://pypi.org/project/pyflakes
]
ignore = [
    "E402",  # Module level import not at top of file, due to Chroma hacks
    "E501",
    "E731",
    "E741",  # Ambiguous variable name: ...
]

# Allow autofix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []
per-file-ignores = {}
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
